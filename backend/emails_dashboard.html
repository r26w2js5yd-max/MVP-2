<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Email Subscribers - Workout Generator</title>
  <style>
    :root {
      --bg:#020817;
      --bg-soft:#071126;
      --surface:rgba(8,15,28,0.92);
      --surface-soft:rgba(12,21,36,0.86);
      --text:#f8fafc;
      --muted:#9eb0ca;
      --accent:#1aa6ff;
      --accent-strong:#0a8fff;
      --border:rgba(26,166,255,0.28);
      --shadow:0 24px 60px rgba(0,0,0,0.42);
      --success:#22c55e;
    }

    * { box-sizing: border-box; }
    body {
      margin:0;
      min-height:100vh;
      font-family: Inter, system-ui, sans-serif;
      color:var(--text);
      background:
        radial-gradient(circle at top, rgba(26,166,255,0.16), transparent 22%),
        linear-gradient(180deg, #000000 0%, #01040a 100%);
    }

    .shell { max-width: 900px; margin: 0 auto; padding: 28px 18px 40px; }
    .hero { display:flex; align-items:flex-start; justify-content:space-between; gap:20px; margin-bottom:24px; }
    .eyebrow { display:inline-flex; padding:4px 10px; border-radius:999px; font-size:11px; font-weight:800; letter-spacing:0.18em; text-transform:uppercase; background:rgba(26,166,255,0.18); color:#8bd0ff; margin-bottom:12px; }
    h1 { margin:0; font-size:2.4rem; }
    .hero p { margin:10px 0 0; color:var(--muted); max-width:720px; line-height:1.55; }
    
    .panel {
      border-radius:18px;
      border:1px solid var(--border);
      background:rgba(6,10,16,0.88);
      box-shadow:var(--shadow);
      padding:18px;
      margin-bottom:18px;
    }
    .panel h2 { margin:0 0 16px; font-size:1.1rem; }
    
    .stats-row { display:grid; grid-template-columns:repeat(3,1fr); gap:12px; margin-bottom:18px; }
    .stat-card {
      border-radius:14px;
      border:1px solid var(--border);
      background:linear-gradient(180deg, rgba(9,14,22,0.94), rgba(7,11,18,0.88));
      padding:16px;
    }
    .stat-label { margin:0; color:var(--muted); font-size:.78rem; text-transform:uppercase; letter-spacing:.14em; }
    .stat-value { margin:10px 0 0; font-size:2rem; font-weight:800; }

    .actions-bar { display:flex; gap:10px; margin-bottom:16px; flex-wrap:wrap; }
    .btn {
      border:none;
      border-radius:999px;
      padding:10px 18px;
      font-size:0.88rem;
      font-weight:700;
      cursor:pointer;
      transition: transform 0.2s ease;
    }
    .btn:hover { transform: translateY(-1px); }
    .btn-primary {
      color:#fff;
      background:linear-gradient(90deg, var(--accent), var(--accent-strong));
    }
    .btn-secondary {
      color:#fff;
      background:rgba(8,12,18,0.78);
      border:1px solid rgba(26,166,255,0.18);
    }

    table { width:100%; border-collapse:collapse; }
    th, td { padding:12px 10px; text-align:left; border-bottom:1px solid rgba(148,163,184,0.14); font-size:.88rem; }
    th { color:#9cb4d4; font-size:.72rem; text-transform:uppercase; letter-spacing:.12em; font-weight:700; }
    tr:hover td { background:rgba(26,166,255,0.04); }
    
    .empty-state { text-align:center; padding:40px 20px; color:var(--muted); }
    .loading { text-align:center; padding:40px 20px; color:var(--accent); }

    @media (max-width: 700px) {
      .stats-row { grid-template-columns:1fr; }
      th, td { padding:8px 6px; font-size:.82rem; }
    }
  </style>
</head>
<body>
  <div class="shell">
    <div class="hero">
      <div>
        <div class="eyebrow">admin dashboard</div>
        <h1>Email Subscribers</h1>
        <p>View and export all email addresses collected from the workout plan generator.</p>
      </div>
    </div>

    <div class="stats-row" id="statsRow"></div>

    <div class="panel">
      <div class="actions-bar">
        <button class="btn btn-primary" onclick="exportCSV()">📥 Export CSV</button>
        <button class="btn btn-secondary" onclick="copyEmails()">📋 Copy All Emails</button>
        <button class="btn btn-secondary" onclick="loadEmails()">🔄 Refresh</button>
      </div>
      <h2>Collected Emails</h2>
      <div id="tableContainer">
        <div class="loading">Loading...</div>
      </div>
    </div>
  </div>

  <script>
    let allEmails = [];

    async function loadEmails() {
      try {
        const response = await fetch('/api/emails');
        const data = await response.json();
        allEmails = data.emails || [];
        renderTable(allEmails);
        renderStats(allEmails);
      } catch (error) {
        document.getElementById('tableContainer').innerHTML = '<div class="empty-state">Error loading emails. Make sure the backend server is running.</div>';
      }
    }

    function renderStats(emails) {
      const today = new Date().toDateString();
      const todayCount = emails.filter(e => new Date(e.timestamp).toDateString() === today).length;
      const totalUnique = new Set(emails.map(e => e.email)).size;

      document.getElementById('statsRow').innerHTML = `
        <div class="stat-card">
          <p class="stat-label">Total Signups</p>
          <p class="stat-value">${emails.length}</p>
        </div>
        <div class="stat-card">
          <p class="stat-label">Unique Emails</p>
          <p class="stat-value">${totalUnique}</p>
        </div>
        <div class="stat-card">
          <p class="stat-label">Today</p>
          <p class="stat-value">${todayCount}</p>
        </div>
      `;
    }

    function renderTable(emails) {
      const container = document.getElementById('tableContainer');
      
      if (emails.length === 0) {
        container.innerHTML = '<div class="empty-state">No emails collected yet. Users will be prompted to enter their email after completing the quiz.</div>';
        return;
      }

      let html = `
        <table>
          <thead>
            <tr>
              <th>#</th>
              <th>Email Address</th>
              <th>Timestamp</th>
              <th>Session ID</th>
              <th>Source</th>
            </tr>
          </thead>
          <tbody>
      `;

      emails.forEach((entry, index) => {
        const date = entry.timestamp ? new Date(entry.timestamp).toLocaleString() : 'N/A';
        const sessionId = entry.session_id ? entry.session_id.slice(0, 8) + '...' : 'N/A';
        const source = entry.source || 'workout_generator';
        
        html += `
          <tr>
            <td>${index + 1}</td>
            <td style="font-weight:600; color:var(--accent);">${escapeHtml(entry.email)}</td>
            <td style="color:var(--muted); font-size:.82rem;">${date}</td>
            <td style="color:var(--muted); font-size:.82rem;">${sessionId}</td>
            <td style="color:var(--muted); font-size:.82rem;">${source}</td>
          </tr>
        `;
      });

      html += '</tbody></table>';
      container.innerHTML = html;
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    function exportCSV() {
      if (allEmails.length === 0) {
        alert('No emails to export');
        return;
      }

      const headers = ['Email', 'Timestamp', 'Session ID', 'Source'];
      const rows = allEmails.map(e => [
        e.email,
        e.timestamp || '',
        e.session_id || '',
        e.source || ''
      ]);

      const csvContent = '\ufeff' + [headers, ...rows].map(row => row.map(cell => `"${cell}"`).join(',')).join('\n');
      downloadFile('email-subscribers.csv', csvContent, 'text/csv;charset=utf-8');
    }

    function copyEmails() {
      if (allEmails.length === 0) {
        alert('No emails to copy');
        return;
      }

      const uniqueEmails = [...new Set(allEmails.map(e => e.email))];
      const text = uniqueEmails.join('\n');
      
      navigator.clipboard.writeText(text).then(() => {
        alert(`Copied ${uniqueEmails.length} unique email addresses to clipboard!`);
      }).catch(() => {
        alert('Failed to copy to clipboard');
      });
    }

    function downloadFile(filename, content, mimeType) {
      const blob = new Blob([content], { type: mimeType });
      const url = URL.createObjectURL(blob);
      const anchor = document.createElement('a');
      anchor.href = url;
      anchor.download = filename;
      document.body.appendChild(anchor);
      anchor.click();
      document.body.removeChild(anchor);
      URL.revokeObjectURL(url);
    }

    // Load emails on page load
    loadEmails();
  </script>
</body>
</html>
